spring:
  application:
    name: Trasport-Management-System

  datasource:
    url: jdbc:mysql://localhost:3306/transport_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update  # Good for early development
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080